# electron-builder.yml — 데스크톱 Electron 패키징 설정 (팀 내부 배포용, 코드 서명 없음)
#
# out/(scripts/build-static-local.sh 공용 코어)을 electron-dist/main.js(웹팩 번들,
# webpack.electron.config.js — build:electron:main)와 함께 그대로 앱에 번들링한다.
# 마켓 배포가 아니므로 서명 없이(mac.identity: null) 빌드하며, Windows는 wine 없이
# 빌드 가능한 zip(포터블) 타깃만 사용한다 — NSIS 설치 프로그램이 필요해지면 macOS에
# wine(brew install --cask wine-stable)을 설치하거나 실제 Windows/CI에서 빌드해야 한다.
appId: com.irondevice.audiosim.desktop
productName: Iron Device Audio Simulator
# electron-dist/main.js(웹팩 번들)는 Node 내장 모듈(http/path/fs)만 쓰고 네이티브
# Node addon이 없다 (mac.extraResources의 audio-device-helper는 child_process로
# spawn하는 별도 컴파일 바이너리일 뿐 Node addon이 아니라 electron-rebuild 대상이 아니다).
# 기본값(true)이면 electron-builder가 node_modules 전체(예: next가 끌어오는 sharp)를
# 타깃 arch별로 재빌드하려다, 크로스 컴파일이 안 되는 조합(예: macOS 호스트에서
# win32/arm64용 sharp)에서 빌드가 실패한다 — 애초에 필요 없는 단계라 꺼둔다.
# Electron(Chromium)이 기본으로 번들링하는 ~55개 로케일(.lproj/locale.pak) 중
# 앱 UI는 한국어 단일 언어라 대부분 불필요하다 — ko 하나만 남겨 용량을 줄인다.
electronLanguages:
  - ko
npmRebuild: false
directories:
  output: dist-electron
  # resources/icon.png (1024x1024) 에서 mac .icns / win .ico 를 자동 생성한다.
  buildResources: resources
files:
  - electron-dist/**/*
  - package.json
  # electron-dist/main.js(웹팩 번들)는 Node 내장 모듈만 쓰고 node_modules 의존성이
  # 없다(위 주석 참고). electron-builder는 기본적으로 package.json의 dependencies
  # (next/react/echarts/wavesurfer.js 등 — 전부 빌드 타임에 out/ 정적 번들로 이미
  # 컴파일된 것들)를 보고 node_modules 전체를 asar에 자동 포함시키므로, 명시적으로
  # 제외해야 한다.
  - "!node_modules/**/*"
# out/ 은 asar 안이 아니라 resources/out 그대로 풀려 있어야 electron/main.js가
# app.isPackaged일 때 process.resourcesPath 기준으로 찾을 수 있다 (asar은 정적
# 산출물처럼 파일 수가 많은 디렉터리를 그대로 서빙하기엔 부적합).
extraResources:
  - from: out
    to: out

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  identity: null
  category: public.app-category.utilities
  extendInfo:
    NSMicrophoneUsageDescription: 실시간 오디오 분석을 위해 마이크 입력을 사용합니다.
  # CoreAudio HAL 헬퍼(native/macos/audio-device-helper/build-mac.sh 산출물, arm64+x64
  # universal binary) — mac 타깃에만 번들링. win/linux는 아직 해당 헬퍼가 없다
  # (계획: native/windows/audio-device-helper/, docs/windows-plan.md).
  extraResources:
    - from: electron/native/macos/audio-device-helper/dist/audio-device-helper
      to: audio-device-helper

win:
  target:
    - target: zip
      arch: [x64, arm64]
  # mac.extraResources와 같은 규칙 — electron/ipc/audio-device.js의 AUDIO_HELPER_PATH가
  # 패키징 시 리소스 루트에서 "audio-device-helper.exe"를 찾는다.
  #
  # mac 헬퍼와 마찬가지로 build-electron.sh가 패키징 직전에 빌드해준다 — 다만 이쪽은
  # mingw-w64 크로스 컴파일이다(build-win.sh). 패키징이 WSL/Linux에서 도는데 MSVC가 없기
  # 때문이며, 같은 호스트에서 빌드까지 끝내야 소스보다 낡은 exe가 패키징되는 사고를 막는다
  # (실제로 겪었다 — 자세한 사정은 audio-device-helper/README.md "빌드" 절).
  # 툴체인/SDK 없이 커밋된 exe로 패키징만 하려면 SKIP_WIN_HELPER_BUILD=1.
  #
  # ⚠️ 이 exe는 x64 전용이다. 위 arch에 arm64가 남아 있으면 arm64 zip에도 같은 x64
  # 바이너리가 복사되어 그 빌드에서는 헬퍼가 실행되지 않는다 (ASIO 드라이버 자체가
  # arm64 Windows에 사실상 없어 arm64 타깃을 뺄지 검토가 필요하다).
  extraResources:
    - from: electron/native/windows/audio-device-helper/dist/audio-device-helper.exe
      to: audio-device-helper.exe

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  category: AudioVideo
