[package]
name = "iron-device-audio-simulator"
version = "0.1.0"
description = "Iron Device Audio Simulator desktop shell"
authors = ["Iron Device Corporation", "JBNU-CILAB"]
license = "GPL-3.0-only"
edition = "2021"

# 측정/디버깅 전용 빌드 플래그. 켜지 않은 배포 빌드에는 DevTools(WebView 인스펙터)가 아예
# 컴파일되지 않는다 — tauri의 open_devtools/is_devtools_open은 물론 wry가 웹뷰에 거는
# WKWebView `isInspectable` / WebView2 `AreDevToolsEnabled` 설정 자체가 false로 굳는다.
# 패키징된 앱에서 window.__ironPerf(지연 측정)를 콘솔로 호출해야 할 때만 켠다:
#   npm run build:tauri:mac -- --devtools   (scripts/build/build-tauri.sh 가 --features 로 전달)
# debug 빌드(npm run tauri:preview)는 이 피처와 무관하게 tauri 기본값대로 항상 열려 있다.
[features]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-mini = "0.4"
# WASM 엔진 암호화 배포(wasm_asset.rs)용 — 순수 Rust(RustCrypto) 크레이트로 골랐다.
# Windows 타깃을 cargo-xwin으로 크로스 컴파일하므로 OpenSSL 링킹이 필요한 크레이트는 피한다.
aes-gcm = "0.10"

[[bin]]
name = "iron-device-audio-simulator"
path = "src/main.rs"
