[package]
name = "iron-device-audio-simulator"
version = "0.1.0"
description = "Iron Device Audio Simulator desktop shell"
authors = ["Iron Device Corporation", "JBNU-CILAB"]
license = "GPL-3.0-only"
edition = "2021"

# 측정/디버깅 전용 빌드 플래그. 켜지 않은 배포 빌드에는 DevTools(WebView 인스펙터)가 아예
# 컴파일되지 않는다 — tauri의 open_devtools/is_devtools_open은 물론 wry가 웹뷰에 거는
# WKWebView `isInspectable` / WebView2 `AreDevToolsEnabled` 설정 자체가 false로 굳는다.
# 켜는 경로는 둘이다(scripts/build/build-tauri.sh 가 --features 로 전달):
#   npm run build:tauri -- --dev        계측(NEXT_PUBLIC_IRON_PERF=1)까지 함께 켠다 — window.__ironPerf 측정용
#   npm run build:tauri -- --devtools   WASM 암호화/하드닝을 배포와 동일하게 유지한 채 인스펙터만 연다
# debug 빌드(npm run tauri:preview)는 이 피처와 무관하게 tauri 기본값대로 항상 열려 있다.
[features]
devtools = ["tauri/devtools"]
# 평문 WASM 리소스 폴백(wasm_asset.rs)을 컴파일에 포함할지. --dev(알고리즘 개발 전용) 빌드에서만
# 켠다(scripts/build/build-tauri.sh). 배포/--devtools 빌드에는 이 피처가 꺼져 있어 평문 폴백
# 코드 자체가 바이너리에 없다 — 설치본 Resources 에 평문 ff_prot.wasm 을 떨어뜨려도 AES-GCM
# 복호화(GCM 태그/AAD 무결성)를 우회할 수 없다(엔진 바꿔치기·평문 우회 벡터 제거).
plain-wasm = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-mini = "0.4"
# WASM 엔진 암호화 배포(wasm_asset.rs)용 — 순수 Rust(RustCrypto) 크레이트로 골랐다.
# Windows 타깃을 cargo-xwin으로 크로스 컴파일하므로 OpenSSL 링킹이 필요한 크레이트는 피한다.
# v2: 복호화 키를 상수로 두지 않고 seed에서 HKDF-SHA256으로 런타임 파생한다(wasm_asset.rs).
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

[[bin]]
name = "iron-device-audio-simulator"
path = "src/main.rs"

# 배포 빌드 하드닝: 심볼 스트립으로 리버싱 단서를 제거한다. 특히 aes-gcm/hkdf 등
# RustCrypto 제네릭 모노모피제이션 심볼이 그대로 남으면 암호 스킴(AES-256-GCM/HKDF)이
# 추측 없이 노출되므로(이번 실험에서 실제 악용됨) strip으로 지운다. lto+codegen-units=1은
# 인라이닝을 늘려 복호화 경로를 함수 경계로 깔끔히 특정하기 어렵게 만드는 부수효과도 있다.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
