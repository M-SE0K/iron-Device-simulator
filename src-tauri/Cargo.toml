[package]
name = "iron-device-audio-simulator"
version = "0.1.0"
description = "Iron Device Audio Simulator desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-mini = "0.4"

[[bin]]
name = "iron-device-audio-simulator"
path = "src/main.rs"
