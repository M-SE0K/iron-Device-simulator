# Postgres 개발용 컨테이너
# 기동:  docker compose up -d
# 확인:  docker ps
# 정지:  docker compose stop   (데이터 유지)
# 제거:  docker compose down    (volume 덕분에 데이터는 보존)

services:
  postgres:
    image: postgres:16
    container_name: irontune-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: irontune
      POSTGRES_PASSWORD: irontune_pw
      POSTGRES_DB: irontune_db
    ports:
      - "5432:5432"
    volumes:
      - irontune_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irontune -d irontune_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  irontune_pgdata:
